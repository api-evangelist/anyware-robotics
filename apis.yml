aid: anyware-robotics

name: Anyware Robotics

description: 'Anyware Robotics provides deployable physical AI robots for physically demanding industrial work. Their AnywareOS platform offers perception, motion planning, and autonomous decision‑making, enabling robots to work alongside people, adapt to shifting conditions, and learn from every operation. The company offers solutions such as palletizing, case picking, trailer loading, and machine tending, aiming to reduce labor costs and improve safety.'

